name: build-and-cache

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v15
        with:
          name: lazypkgs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build all packages
        run: |
          set -euo pipefail
          pkgs=$(nix eval --raw --accept-flake-config \
            '.#packages.x86_64-linux' \
            --apply 'p: builtins.concatStringsSep " " (builtins.attrNames p)')
          for pkg in $pkgs; do
            echo "::group::build $pkg"
            nix build ".#$pkg" --accept-flake-config --print-build-logs
            echo "::endgroup::"
          done
