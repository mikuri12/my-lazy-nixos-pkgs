name: update-rolling

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Bump eden-nightly
        run: bash scripts/update-eden-nightly.sh

      - name: Bump hayase
        run: bash scripts/update-hayase.sh

      - name: Format with alejandra
        run: nix run nixpkgs#alejandra -- -q .

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/update-rolling
          delete-branch: true
          title: "chore: actualizar paquetes rolling (eden-nightly, hayase)"
          commit-message: "chore: bump rolling (eden-nightly, hayase)"
          body: |
            Bump automático de las fuentes rolling (solo-última versión):
            eden-emu-nightly y hayase. Revisa y mergea si los builds pasan.
          labels: automated, dependencies
