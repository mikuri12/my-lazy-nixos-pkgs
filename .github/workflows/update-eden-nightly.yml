name: update-eden-nightly

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Bump eden-nightly
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          bash scripts/update-eden-nightly.sh

      - name: Format with alejandra
        run: nix run nixpkgs#alejandra -- -q .

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/update-eden-nightly
          delete-branch: true
          title: "chore: actualizar eden-nightly"
          commit-message: "chore: bump eden-nightly (último build)"
          body: |
            Bump automático de `eden-emu-nightly` al último nightly de
            git.eden-emu.dev. Revisa y mergea si el build pasa.
          labels: automated, dependencies
